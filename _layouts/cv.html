---
layout: page
---

<style>
/* ==== Resume CV styles (scoped to .cv-container) ==== */
:root{
    --navy: #1f3a5f;
    --navy-deep: #16283f;
    --gold: #c9a24b;
    --ink: #24303c;
    --muted: #5b6876;
    --line: #e6e9ee;
    --bg: #f7f8fa;
    --card: #ffffff;
  }}
.cv-container *{ margin: 0; padding: 0; box-sizing: border-box; }}
.cv-container{ scroll-behavior: smooth; }}
.cv-container{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }}
.cv-container .wrap{ max-width: 920px; margin: 0 auto; padding: 0 24px; }}
.cv-container /* Hero */
  header.hero{
    background: linear-gradient(135deg, var(--navy-deep) 0%, var(--navy) 55%, #2e547f 100%);
    color: #fff;
    padding: 72px 0 60px;
    position: relative;
    overflow: hidden;
  }}
.cv-container header.hero::after{
    content: "";
    position: absolute;
    right: -80px; top: -80px;
    width: 340px; height: 340px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 50%;
  }}
.cv-container header.hero::before{
    content: "";
    position: absolute;
    right: 20px; top: -20px;
    width: 220px; height: 220px;
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 50%;
  }}
.cv-container .hero-inner{ position: relative; z-index: 1; display: flex; align-items: center; gap: 30px; }}
.cv-container .avatar{ width: 140px; height: 140px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); flex-shrink: 0; box-shadow: 0 6px 20px rgba(0,0,0,.25); }}
.cv-container .hero-text{ flex: 1; min-width: 0; }}

  @media (max-width: 600px) {
.cv-container .hero-inner{ flex-direction: column; text-align: center; gap: 18px; }
}.cv-container .avatar{ width: 110px; height: 110px; }}

  }
.cv-container .hero .eyebrow{
    font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold); margin-bottom: 14px; font-weight: 600;
  }}
.cv-container .hero h1{
    font-size: 46px; font-weight: 700; letter-spacing: .5px; line-height: 1.1;
    font-family: Georgia, "Times New Roman", serif;
  }}
.cv-container .hero .role{
    font-size: 20px; margin-top: 10px; color: #dbe4ee; font-weight: 400;
  }}
.cv-container .hero .role span{ color: var(--gold); }}
.cv-container .hero .meta{
    margin-top: 26px; display: flex; flex-wrap: wrap; gap: 10px 26px;
    font-size: 14px; color: #c6d2e0;
  }}
.cv-container .hero .meta b{ color: #fff; font-weight: 600; }}
.cv-container /* Sections */
  section{ padding: 52px 0; }}
.cv-container section.alt{ background: var(--card); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }}
.cv-container .sec-title{
    display: flex; align-items: center; gap: 12px; margin-bottom: 26px;
    font-family: Georgia, "Times New Roman", serif; font-size: 22px; color: var(--navy);
  }}
.cv-container .sec-title::after{ content: ""; flex: 1; height: 1px; background: var(--line); }}
.cv-container .sec-title .no{ color: var(--gold); font-size: 15px; font-family: inherit; letter-spacing: 1px; }}
.cv-container /* About grid */
  .about-grid{
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px;
  }}
.cv-container .about-item{ background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }}
.cv-container .about-item .k{ font-size: 12px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); margin-bottom: 4px; }}
.cv-container .about-item .v{ font-size: 16px; font-weight: 600; color: var(--navy); }}
.cv-container /* Timeline (education / experience) */
  .tl{ position: relative; padding-left: 28px; }}
.cv-container .tl::before{ content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px; width: 2px; background: var(--line); }}
.cv-container .tl-item{ position: relative; padding-bottom: 30px; }}
.cv-container .tl-item:last-child{ padding-bottom: 0; }}
.cv-container .tl-item::before{
    content: ""; position: absolute; left: -26px; top: 7px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 0 4px #f3e9d2;
  }}
.cv-container .tl-item .period{
    font-size: 13px; font-weight: 600; color: var(--gold); letter-spacing: .4px;
    text-transform: uppercase; margin-bottom: 2px;
  }}
.cv-container .tl-item h3{ font-size: 18px; color: var(--navy); font-weight: 700; }}
.cv-container .tl-item .sub{ font-size: 14px; color: var(--muted); margin-bottom: 8px; }}
.cv-container .tl-item ul{ list-style: none; margin-top: 8px; }}
.cv-container .tl-item ul li{
    position: relative; padding-left: 18px; margin-bottom: 7px; font-size: 14.5px;
  }}
.cv-container .tl-item ul li::before{ content: "–"; position: absolute; left: 0; color: var(--gold); }}
.cv-container /* Work cards */
  .work-card{
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 24px; margin-bottom: 16px;
  }}
.cv-container .work-card h3{ font-size: 17px; color: var(--navy); margin-bottom: 4px; }}
.cv-container .work-card .sub{ font-size: 13px; color: var(--muted); margin-bottom: 10px; }}
.cv-container .work-card p{ font-size: 14.5px; }}
.cv-container .work-card .tag{
    display: inline-block; background: #eef3f8; color: var(--navy); font-size: 12px;
    padding: 2px 10px; border-radius: 999px; margin-right: 6px; margin-bottom: 6px; font-weight: 500;
  }}
.cv-container /* Skills */
  .skills{ display: flex; flex-wrap: wrap; gap: 12px; }}
.cv-container .skill{
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 20px; flex: 1 1 240px;
  }}
.cv-container .skill h3{ font-size: 16px; color: var(--navy); margin-bottom: 4px; }}
.cv-container .skill p{ font-size: 13.5px; color: var(--muted); }}
.cv-container footer{
    background: var(--navy-deep); color: #9fb0c3; text-align: center;
    padding: 34px 0; font-size: 13px;
  }}
.cv-container footer b{ color: #fff; }}


  @media (max-width: 600px) {
.cv-container header.hero{ padding: 52px 0 44px; }
}.cv-container .hero h1{ font-size: 34px; }}
.cv-container .hero .role{ font-size: 17px; }}

  }


</style>

<div class="cv-container">
{{ content }}
</div>
